name: Stable Compilation

on:
  workflow_dispatch:
    inputs:
      git-ref:
        description: Git Ref (Optional)
        required: false
      notarize-macos:
        description: Notarize MacOS app
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  QT_VERSION: "6.10.1"
  # vcpkg, at a fixed commit: the libraries it builds are kept between runs
  VCPKG_COMMIT: e456309491fd875487bf02b8a0dca76c1b1b00cc
  # Qt's tools warn on every call without a UTF-8 locale
  LC_ALL: C.UTF-8
  CCACHE_MAXSIZE: 500M
  CCACHE_COMPILERCHECK: content
  # the precompiled headers (EDITOR_PRECOMPILE_HEADERS) through ccache
  CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime

jobs:
  flatpak:
    name: "Flatpak (x86_64)"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      # without a cache-key, the cache of the libraries is named after the
      # manifest: it is saved again only when the manifest changes
      - uses: bilelmoussaoui/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: EasyRPG-Editor.flatpak
          manifest-path: builds/flatpak/org.easyrpg.editor.yml

  # The x86_64 build is the AppImage's
  docker:
    name: ${{ matrix.image }} (${{ matrix.os.arch }})
    runs-on: ${{ matrix.os.name }}
    container:
      image: ${{ matrix.image }}
    env:
      VCPKG_DEFAULT_BINARY_CACHE: /vcpkg-cache/archives
      VCPKG_DOWNLOADS: /vcpkg-cache/downloads
      CCACHE_DIR: /ccache

    strategy:
      fail-fast: false
      matrix:
        image:
          #   version of: # CMake  | g++    | Qt        |  support end  #
          # -------------------------------------------------------------
          - ubuntu:24.04 # 3.28.3 | 13.2.0 | (too old) | LTS    (4/29) #
        os:
          - arch: arm64
            name: ubuntu-24.04-arm
            triplet: arm64-linux-release

    steps:
      - &deps
        name: Install dependencies
        run: |
          export DEBIAN_FRONTEND="noninteractive"
          apt-get update
          apt-get install -yqq --no-install-recommends --no-install-suggests \
            ca-certificates build-essential cmake ninja-build git ccache \
            libicu-dev curl zip unzip tar tzdata
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE" "$VCPKG_DOWNLOADS" "$CCACHE_DIR"
          echo "compiler=$(gcc -dumpfullversion)" >> "$GITHUB_OUTPUT"
        id: deps

      - &qt6
        name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          install-deps: "nosudo"
          modules: "qtmultimedia"
          cache: true

      - &vcpkg
        name: Install vcpkg
        run: |
          git init -q ../vcpkg
          git -C ../vcpkg fetch -q --depth 1 https://github.com/microsoft/vcpkg.git "$VCPKG_COMMIT"
          git -C ../vcpkg checkout -q FETCH_HEAD

      # The libraries vcpkg builds, kept between runs. vcpkg rebuilds a
      # library when its port changes, but not when the compiler does: it
      # names the cache
      - &vcpkgcache
        name: Cache the libraries of vcpkg
        uses: actions/cache@v6
        with:
          path: /vcpkg-cache
          key: vcpkg-${{ matrix.os.triplet }}-gcc${{ steps.deps.outputs.compiler }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ matrix.os.triplet }}-gcc${{ steps.deps.outputs.compiler }}-

      # What the Editor compiled before: a push recompiles what it changed
      - &ccache
        name: Cache the compiled files
        uses: actions/cache@v6
        with:
          path: /ccache
          key: ccache-${{ matrix.os.triplet }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.os.triplet }}-

      - &clone
        name: Clone Repository
        uses: actions/checkout@v7
        if: github.event.inputs.git-ref == ''

      - &cloneref
        name: Clone Repository (with custom ref)
        uses: actions/checkout@v7
        if: github.event.inputs.git-ref != ''
        with:
          ref: ${{ github.event.inputs.git-ref }}

      - name: Use gcc problem matcher
        run: echo "::add-matcher::.github/gcc_comment_matcher.json"

      # The libraries in Release only: the Editor is built in Release
      - name: Compile
        run: |
          export VCPKG_ROOT=$PWD/../vcpkg
          export Qt6_Path=$QT_ROOT_DIR
          ccache -z
          cmake --preset vcpkg-liblcf-release -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_PREFIX_PATH=$QT_ROOT_DIR -DLIBLCF_WITH_ICU=OFF \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.os.triplet }} -DVCPKG_HOST_TRIPLET=${{ matrix.os.triplet }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build --preset vcpkg-liblcf-release
          ccache -s

      - name: Install
        run: |
          cmake --build --preset vcpkg-liblcf-release --target install

  appimage:
    name: "AppImage (x86_64)"
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
      options: --privileged
    env:
      VCPKG_DEFAULT_BINARY_CACHE: /vcpkg-cache/archives
      VCPKG_DOWNLOADS: /vcpkg-cache/downloads
      CCACHE_DIR: /ccache
    strategy:
      matrix:
        os:
          - triplet: x64-linux-release

    steps:
      - *deps

      - name: Install linuxdeploy dependencies
        run: |
          export DEBIAN_FRONTEND="noninteractive"
          # linuxdeploy copies into the AppImage the libraries Qt and its
          # plugins use (windows on X11 and Wayland, ffmpeg, sound): they must
          # be installed
          apt-get install -yqq --no-install-recommends --no-install-suggests \
            file fuse \
            libgl1 libegl1 libfontconfig1 libfreetype6 libdbus-1-3 libglib2.0-0t64 \
            libx11-6 libx11-xcb1 libxext6 libxfixes3 libxi6 libxrandr2 libxrender1 \
            libxkbcommon0 libxkbcommon-x11-0 libxcb1 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-util1 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb-xkb1 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1 \
            libdrm2 libva2 libva-drm2 libva-x11-2 libpulse0

      - *qt6
      - *vcpkg
      - *vcpkgcache
      - *ccache
      - *clone
      - *cloneref

      - name: Download linuxdeploy
        run: |
          curl -LO https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

      - name: Download linuxdeploy qt plugin
        run: |
          curl -LO https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Compile
        run: |
          export VCPKG_ROOT=$PWD/../vcpkg
          export Qt6_Path=$QT_ROOT_DIR
          ccache -z
          cmake --preset vcpkg-liblcf-release -DCMAKE_INSTALL_PREFIX=AppDir \
            -DCMAKE_PREFIX_PATH=$QT_ROOT_DIR \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.os.triplet }} -DVCPKG_HOST_TRIPLET=${{ matrix.os.triplet }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build --preset vcpkg-liblcf-release
          ccache -s

      - name: Install
        run: |
          cmake --build --preset vcpkg-liblcf-release --target install

      - name: Build AppImage
        run: |
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable AppDir/bin/easyrpg-editor \
            --desktop-file AppDir/share/applications/easyrpg-editor.desktop \
            --icon-file AppDir/share/icons/hicolor/48x48/apps/easyrpg-editor.png \
            --output appimage \
            --plugin qt

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: EasyRPG-Editor-AppImage
          path: ./EasyRPG*.AppImage

  # Built with the official Qt, for macOS 13.3 and later: Homebrew's runs on
  # the newest macOS only
  macos:
    name: "macOS"
    runs-on: macos-26
    env:
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
      MACOSX_DEPLOYMENT_TARGET: "13.3"
      MACOS_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_BASE64 }}
      MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD }}

    steps:
      - *clone
      - *cloneref

      - name: Use gcc problem matcher
        run: echo "::add-matcher::.github/gcc_comment_matcher.json"

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: "qtmultimedia"
          cache: true

      - name: Folders and ccache
        run: |
          brew install ccache
          {
            echo "QT_DIR=$QT_ROOT_DIR"
            echo "DEPS_DIR=$RUNNER_TEMP/editor-deps"
            echo "CCACHE_DIR=$RUNNER_TEMP/ccache"
          } >> "$GITHUB_ENV"

      # ICU and inih, built by build.sh for both kinds of Mac: Homebrew's
      # are for the newest macOS only
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ${{ env.DEPS_DIR }}/install
          key: editor-deps-macos${{ env.MACOSX_DEPLOYMENT_TARGET }}-${{ hashFiles('builds/macos/build.sh') }}

      - name: Cache the compiled files
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-macos-${{ github.sha }}
          restore-keys: |
            ccache-macos-

      # one build for both kinds of Mac: the tests run on it (on this Mac's
      # kind), then it is packaged
      - name: Compile
        env:
          ARCHS: "arm64;x86_64"
        run: |
          ccache -z
          builds/macos/build.sh --tests
          ccache -s

      - name: Test
        run: |
          ctest --test-dir build --output-on-failure

      - name: Import the Developer ID certificate
        if: env.MACOS_DEVELOPER_ID_CERTIFICATE_BASE64 != ''
        run: |
          CERTIFICATE="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          printf '%s' "$MACOS_DEVELOPER_ID_CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          security import "$CERTIFICATE" -P "$MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm -f "$CERTIFICATE"
          security list-keychain -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN"
          echo "SIGN_IDENTITY=${{ secrets.MACOS_SIGN_IDENTITY }}" >> "$GITHUB_ENV"

      - name: Package
        env:
          APPLE_ID: ${{ inputs.notarize-macos && secrets.APPLE_ID || '' }}
          APPLE_TEAM_ID: ${{ inputs.notarize-macos && secrets.APPLE_TEAM_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ inputs.notarize-macos && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
        run: |
          builds/macos/package.sh

      - name: Upload the disk image
        uses: actions/upload-artifact@v7
        with:
          name: EasyRPG-Editor-macOS
          path: build/dist/*.dmg
