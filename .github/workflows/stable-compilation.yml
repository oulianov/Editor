name: Stable Compilation

on:
  workflow_dispatch:
    inputs:
      git-ref:
        description: Git Ref (Optional)
        required: false
      # the platforms built
      flatpak:
        description: Linux Flatpak (x86_64)
        type: boolean
        default: true
      appimage:
        description: Linux AppImage (x86_64)
        type: boolean
        default: true
      linux-arm64:
        description: Linux build check (arm64, no package)
        type: boolean
        default: true
      macos:
        description: macOS disk image
        type: boolean
        default: true
      notarize-macos:
        description: Notarize MacOS app
        type: boolean
        default: true
      windows:
        description: Windows zip (x64)
        type: boolean
        default: true
      # run from editor-ux, whose caches it uses (a run of a tag would start
      # with none): the latest release must have the version of what is built
      attach-to-latest-release:
        description: Attach to the latest release (notarizes the macOS app)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # the Qt of every build (aqt): the version the Editor is developed with.
  # Kirigami, Breeze and KDDockWidgets use its private headers: what is built
  # with them is cached per Qt version
  QT_VERSION: "6.11.2"
  # vcpkg, at a fixed commit: the libraries it builds are kept between runs
  VCPKG_COMMIT: e456309491fd875487bf02b8a0dca76c1b1b00cc
  # Qt's tools warn on every call without a UTF-8 locale
  LC_ALL: C.UTF-8
  CCACHE_MAXSIZE: 500M
  CCACHE_COMPILERCHECK: content
  # (no precompiled headers with ccache: CMakeLists.txt turns them off and
  # gives ccache its settings)

jobs:
  # First, with "Attach to the latest release": the latest published
  # release's tag must be "v" and the version of CMakeLists.txt, or nothing is
  # built. Without it, nothing to check
  check-release:
    name: "Check the latest release"
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Read the version to build
        if: inputs.attach-to-latest-release
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.git-ref || github.sha }}
          sparse-checkout: CMakeLists.txt
          sparse-checkout-cone-mode: false

      - name: Compare it with the latest release
        id: check
        if: inputs.attach-to-latest-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^project(EasyRPG_Editor VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          echo "To build: $version ($(git rev-parse --short HEAD)); latest release: $tag"
          if [ "$tag" != "v$version" ]; then
            echo "::error::The latest release is $tag, the version to build $version"
            exit 1
          fi
          tagged="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)"
          [ "$tagged" = "$(git rev-parse HEAD)" ] \
            || echo "::warning::$tag is the commit ${tagged:0:7}, the one built $(git rev-parse --short HEAD)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  flatpak:
    name: "Flatpak (x86_64)"
    if: inputs.flatpak
    needs: check-release
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      # without a cache-key, the cache of the libraries is named after the
      # manifest: it is saved again only when the manifest changes
      - uses: bilelmoussaoui/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: EasyRPG-Editor.flatpak
          manifest-path: builds/flatpak/org.easyrpg.editor.yml

  # The x86_64 build is the AppImage's
  docker:
    name: ${{ matrix.image }} (${{ matrix.os.arch }})
    if: inputs.linux-arm64
    runs-on: ${{ matrix.os.name }}
    container:
      image: ${{ matrix.image }}
    env:
      VCPKG_DEFAULT_BINARY_CACHE: /vcpkg-cache/archives
      VCPKG_DOWNLOADS: /vcpkg-cache/downloads
      CCACHE_DIR: /ccache

    strategy:
      fail-fast: false
      matrix:
        image:
          #   version of: # CMake  | g++    | Qt        |  support end  #
          # -------------------------------------------------------------
          - ubuntu:24.04 # 3.28.3 | 13.2.0 | (too old) | LTS    (4/29) #
        os:
          - arch: arm64
            name: ubuntu-24.04-arm
            triplet: arm64-linux-release

    steps:
      - &deps
        name: Install dependencies
        run: |
          export DEBIAN_FRONTEND="noninteractive"
          apt-get update
          # fontconfig and freetype: Qt's tools (qsb, for Kirigami's shaders)
          # and the Editor of the test load Qt GUI, which needs them
          apt-get install -yqq --no-install-recommends --no-install-suggests \
            ca-certificates build-essential cmake ninja-build git ccache \
            libicu-dev curl zip unzip tar tzdata libfontconfig1 libfreetype6
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE" "$VCPKG_DOWNLOADS" "$CCACHE_DIR"
          echo "compiler=$(gcc -dumpfullversion)" >> "$GITHUB_OUTPUT"
        id: deps

      - &qt6
        name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          install-deps: "nosudo"
          # Qt Quick comes with the base; Kirigami needs the shader tools
          modules: "qtmultimedia qtshadertools"
          cache: true

      - &vcpkg
        name: Install vcpkg
        run: |
          git init -q ../vcpkg
          git -C ../vcpkg fetch -q --depth 1 https://github.com/microsoft/vcpkg.git "$VCPKG_COMMIT"
          git -C ../vcpkg checkout -q FETCH_HEAD

      # The libraries vcpkg builds, kept between runs. vcpkg rebuilds a
      # library when its port changes, but not when the compiler or Qt does
      # (the KDE ports build against the Qt of aqt): they name the cache.
      # Saved right after the build, not at the end of the job: a failed
      # test or package keeps them
      - &vcpkgcache
        name: Restore the libraries of vcpkg
        id: vcpkgcache
        uses: actions/cache/restore@v6
        with:
          path: /vcpkg-cache
          key: vcpkg-${{ matrix.os.triplet }}-gcc${{ steps.deps.outputs.compiler }}-qt${{ env.QT_VERSION }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'builds/vcpkg_overlay/**') }}
          restore-keys: |
            vcpkg-${{ matrix.os.triplet }}-gcc${{ steps.deps.outputs.compiler }}-qt${{ env.QT_VERSION }}-

      # What the Editor compiled before: a push recompiles what it changed
      - &ccache
        name: Restore the compiled files
        uses: actions/cache/restore@v6
        with:
          path: /ccache
          key: ccache-${{ matrix.os.triplet }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.os.triplet }}-

      - &clone
        name: Clone Repository
        uses: actions/checkout@v7
        if: github.event.inputs.git-ref == ''

      - &cloneref
        name: Clone Repository (with custom ref)
        uses: actions/checkout@v7
        if: github.event.inputs.git-ref != ''
        with:
          ref: ${{ github.event.inputs.git-ref }}

      - name: Use gcc problem matcher
        run: echo "::add-matcher::.github/gcc_comment_matcher.json"

      # the game the start-up test opens: a copy of TestGame-2003
      - &testgame
        name: Download the test game
        run: |
          builds/testgame.sh "$PWD/build/testgame2003"

      # The libraries in Release only: the Editor is built in Release.
      # Configuring builds the libraries of vcpkg
      - name: Configure
        id: configure
        run: |
          export VCPKG_ROOT=$PWD/../vcpkg
          export Qt6_Path=$QT_ROOT_DIR
          cmake --preset vcpkg-liblcf-release -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" -DLIBLCF_WITH_ICU=OFF \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.os.triplet }} -DVCPKG_HOST_TRIPLET=${{ matrix.os.triplet }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DEDITOR_TEST_PROJECT="$PWD/build/testgame2003"

      - &build
        name: Compile
        run: |
          ccache -z
          cmake --build --preset vcpkg-liblcf-release
          ccache -s

      # all of them built: saved even when the Editor did not compile
      - &vcpkgsave
        name: Save the libraries of vcpkg
        if: always() && steps.configure.outcome == 'success' && steps.vcpkgcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: /vcpkg-cache
          key: ${{ steps.vcpkgcache.outputs.cache-primary-key }}

      # even when the build failed: what compiled is kept
      - &ccachesave
        name: Save the compiled files
        if: always() && steps.configure.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: /ccache
          key: ccache-${{ matrix.os.triplet }}-${{ github.sha }}

      # the Editor opens the test game, offscreen (no display here)
      - name: Test
        run: |
          ctest --test-dir build/vcpkg-liblcf-release --output-on-failure --no-tests=error

      - name: Install
        run: |
          cmake --build --preset vcpkg-liblcf-release --target install

  appimage:
    name: "AppImage (x86_64)"
    if: inputs.appimage
    needs: check-release
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
      options: --privileged
    env:
      VCPKG_DEFAULT_BINARY_CACHE: /vcpkg-cache/archives
      VCPKG_DOWNLOADS: /vcpkg-cache/downloads
      CCACHE_DIR: /ccache
    strategy:
      matrix:
        os:
          - triplet: x64-linux-release

    steps:
      - *deps

      - name: Install linuxdeploy dependencies
        run: |
          export DEBIAN_FRONTEND="noninteractive"
          # linuxdeploy copies into the AppImage the libraries Qt and its
          # plugins use (windows on X11 and Wayland, ffmpeg, sound): they must
          # be installed
          apt-get install -yqq --no-install-recommends --no-install-suggests \
            file fuse libsm6 libice6 \
            libgl1 libegl1 libfontconfig1 libfreetype6 libdbus-1-3 libglib2.0-0t64 \
            libx11-6 libx11-xcb1 libxext6 libxfixes3 libxi6 libxrandr2 libxrender1 \
            libxkbcommon0 libxkbcommon-x11-0 libxcb1 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-util1 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb-xkb1 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1 \
            libdrm2 libva2 libva-drm2 libva-x11-2 libpulse0

      - *qt6
      - *vcpkg
      - *vcpkgcache
      - *ccache
      - *clone
      - *cloneref
      - *testgame

      - name: Download linuxdeploy
        run: |
          curl -LO https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

      - name: Download linuxdeploy qt plugin
        run: |
          curl -LO https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Configure
        id: configure
        run: |
          export VCPKG_ROOT=$PWD/../vcpkg
          export Qt6_Path=$QT_ROOT_DIR
          cmake --preset vcpkg-liblcf-release -DCMAKE_INSTALL_PREFIX=AppDir \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.os.triplet }} -DVCPKG_HOST_TRIPLET=${{ matrix.os.triplet }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - *build
      - *vcpkgsave
      - *ccachesave

      - name: Install
        run: |
          cmake --build --preset vcpkg-liblcf-release --target install

      # the QML modules the interface imports, found by the Qt plugin of
      # linuxdeploy: Qt's, and those of vcpkg (Kirigami, Breeze; static
      # libraries, linked in the Editor, as KDDockWidgets). The offscreen
      # platform too: --script runs the Editor without a display. Qt
      # Multimedia's GStreamer backend is left out (the Editor plays through
      # FFmpeg, Qt's default): it would need GStreamer's libraries. It is
      # only moved aside: Qt's CMake files (and Qt's cache) name it. Qt 6.11's
      # Linux build has none
      - name: Build AppImage
        run: |
          gstreamer="$QT_ROOT_DIR/plugins/multimedia/libgstreamermediaplugin.so"
          if [ -e "$gstreamer" ]; then
            mkdir -p ../qt-plugins-aside
            mv "$gstreamer" ../qt-plugins-aside/
            trap 'mv ../qt-plugins-aside/libgstreamermediaplugin.so "$gstreamer"' EXIT
          fi
          export QML_SOURCES_PATHS="$PWD/src"
          kirigami="$(find "$PWD/build" -type d -path '*vcpkg_installed*/org/kde/kirigami' | head -1)"
          export QML_MODULES_PATHS="${kirigami%/org/kde/kirigami}"
          export EXTRA_PLATFORM_PLUGINS="libqoffscreen.so"
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable AppDir/bin/easyrpg-editor \
            --desktop-file AppDir/share/applications/easyrpg-editor.desktop \
            --icon-file AppDir/share/icons/hicolor/48x48/apps/easyrpg-editor.png \
            --output appimage \
            --plugin qt

      # what it bundles, without Qt Widgets; then it opens the test game
      # (tests/startup.txt), with the Qt and the QML modules it bundles only
      - name: Check the AppImage
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          appimage=$(ls EasyRPG*.AppImage)
          "./$appimage" --appimage-extract >/dev/null
          find squashfs-root/usr/lib squashfs-root/usr/plugins squashfs-root/usr/qml -maxdepth 2 | sort
          if find squashfs-root -name 'libQt6Widgets*' | grep .; then
            echo "::error::The AppImage bundles Qt Widgets"
            exit 1
          fi
          env -u QT_PLUGIN_PATH -u QML2_IMPORT_PATH -u LD_LIBRARY_PATH \
            "./$appimage" --appimage-extract-and-run --script tests/startup.txt build/testgame2003
          rm -rf squashfs-root

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: EasyRPG-Editor-AppImage
          path: ./EasyRPG*.AppImage

  # Built with the official Qt, for macOS 13.3 and later: Homebrew's runs on
  # the newest macOS only
  macos:
    name: "macOS"
    if: inputs.macos
    needs: check-release
    runs-on: macos-26
    env:
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      MACOSX_DEPLOYMENT_TARGET: "13.3"
      # both kinds of Mac in each object file: 500M holds only part of a build
      CCACHE_MAXSIZE: 2G
      # what is attached to a release is always notarized
      NOTARIZE: ${{ inputs.notarize-macos || inputs.attach-to-latest-release }}
      MACOS_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_BASE64 }}
      MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD }}

    steps:
      # before the build: notarizing needs every secret (only whether each
      # is set is read here)
      - name: Check the signing secrets
        if: env.NOTARIZE == 'true'
        env:
          HAS_CERTIFICATE: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_BASE64 != '' }}
          HAS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD != '' }}
          HAS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY != '' }}
          HAS_APPLE_ID: ${{ secrets.APPLE_ID != '' }}
          HAS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
          HAS_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD != '' }}
        run: |
          missing=()
          [ "$HAS_CERTIFICATE" = true ] || missing+=(MACOS_DEVELOPER_ID_CERTIFICATE_BASE64)
          [ "$HAS_CERTIFICATE_PASSWORD" = true ] || missing+=(MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD)
          [ "$HAS_SIGN_IDENTITY" = true ] || missing+=(MACOS_SIGN_IDENTITY)
          [ "$HAS_APPLE_ID" = true ] || missing+=(APPLE_ID)
          [ "$HAS_APPLE_TEAM_ID" = true ] || missing+=(APPLE_TEAM_ID)
          [ "$HAS_APPLE_APP_SPECIFIC_PASSWORD" = true ] || missing+=(APPLE_APP_SPECIFIC_PASSWORD)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Notarizing needs these repository secrets: ${missing[*]} (or run without \"Notarize MacOS app\")"
            exit 1
          fi

      - *clone
      - *cloneref

      - name: Use gcc problem matcher
        run: echo "::add-matcher::.github/gcc_comment_matcher.json"

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: "qtmultimedia qtshadertools"
          cache: true

      - name: Folders and ccache
        run: |
          brew install ccache
          {
            echo "QT_DIR=$QT_ROOT_DIR"
            echo "DEPS_DIR=$RUNNER_TEMP/editor-deps"
            echo "CCACHE_DIR=$RUNNER_TEMP/ccache"
          } >> "$GITHUB_ENV"

      # ICU, inih and glaze, and Kirigami, Breeze and KDDockWidgets (for this
      # Qt), built by build.sh for both kinds of Mac: Homebrew's are for the
      # newest macOS only. Saved right after the build, not at the end of the
      # job: a failed test or package keeps them. After a change of build.sh,
      # the ones of an earlier build.sh: it builds again only those whose
      # version changed
      - name: Restore the dependencies
        id: deps
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.DEPS_DIR }}/install
            ${{ env.DEPS_DIR }}/kde
          key: editor-deps-macos${{ env.MACOSX_DEPLOYMENT_TARGET }}-qt${{ env.QT_VERSION }}-${{ hashFiles('builds/macos/build.sh') }}
          restore-keys: |
            editor-deps-macos${{ env.MACOSX_DEPLOYMENT_TARGET }}-qt${{ env.QT_VERSION }}-

      - name: Restore the compiled files
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-macos-${{ github.sha }}
          restore-keys: |
            ccache-macos-

      # one build for both kinds of Mac: the tests run on it (on this Mac's
      # kind), then it is packaged
      - name: Compile
        env:
          ARCHS: "arm64;x86_64"
        run: |
          ccache -z
          builds/macos/build.sh --tests
          ccache -s

      - name: Save the dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.DEPS_DIR }}/install
            ${{ env.DEPS_DIR }}/kde
          key: ${{ steps.deps.outputs.cache-primary-key }}

      # even when the build failed: what compiled is kept
      - name: Save the compiled files
        if: always() && steps.deps.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-macos-${{ github.sha }}

      # the start-up test (build.sh --tests downloaded its game), offscreen
      - name: Test
        run: |
          ctest --test-dir build --output-on-failure --no-tests=error

      - name: Import the Developer ID certificate
        if: env.MACOS_DEVELOPER_ID_CERTIFICATE_BASE64 != ''
        run: |
          CERTIFICATE="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          printf '%s' "$MACOS_DEVELOPER_ID_CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          security import "$CERTIFICATE" -P "$MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm -f "$CERTIFICATE"
          security list-keychain -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN"
          echo "SIGN_IDENTITY=${{ secrets.MACOS_SIGN_IDENTITY }}" >> "$GITHUB_ENV"

      - name: Package
        env:
          APPLE_ID: ${{ env.NOTARIZE == 'true' && secrets.APPLE_ID || '' }}
          APPLE_TEAM_ID: ${{ env.NOTARIZE == 'true' && secrets.APPLE_TEAM_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ env.NOTARIZE == 'true' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
        run: |
          builds/macos/package.sh

      # the packaged Editor opens the test game (tests/startup.txt), with the
      # Qt and the QML modules it carries only
      - name: Check the application
        timeout-minutes: 5
        run: |
          cp -R build/testgame2003 "$RUNNER_TEMP/testgame-package"
          env -u QT_PLUGIN_PATH -u QML2_IMPORT_PATH \
            "build/dist/EasyRPG Editor.app/Contents/MacOS/EasyRPG Editor" \
            --script tests/startup.txt "$RUNNER_TEMP/testgame-package"

      - name: Upload the disk image
        uses: actions/upload-artifact@v7
        with:
          name: EasyRPG-Editor-macOS
          path: build/dist/*.dmg

  # Built with MSVC and the official Qt, for Windows 10 1903 and later:
  # liblcf reads the encodings of the games with the ICU of Windows
  windows:
    name: "Windows (x64)"
    if: inputs.windows
    needs: check-release
    runs-on: windows-2025
    env:
      # the libraries of vcpkg linked in the Editor, with the runtime of Qt
      TRIPLET: x64-windows-static-md
      # vcpkg builds in a clean environment on Windows: the KDE ports find
      # the Qt of aqt through Qt6_Path (builds/vcpkg_overlay)
      VCPKG_KEEP_ENV_VARS: Qt6_Path

    steps:
      - *clone
      - *cloneref

      # cl, link and the paths of the Windows SDK, for the next steps: what
      # vcvars64.bat of Visual Studio changes in the environment
      - name: Set up MSVC
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64
          if (-not $vs) { Write-Error "No Visual Studio with the C++ tools"; exit 1 }
          $before = @{}
          Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
          cmd /c "`"$vs/VC/Auxiliary/Build/vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$' -and $before[$matches[1]] -ne $matches[2]) {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # aqtinstall 3.3.0 (the latest release) does not know the folders of
      # the Windows Qt 6.11 and later: its fix, not released yet, at a fixed
      # commit (it needs a newer py7zr than the action's default)
      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: "qtmultimedia qtshadertools"
          aqtsource: "git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7"
          py7zrversion: ">=1.1.3"
          cache: true

      - name: Folders
        run: |
          temp=$(cygpath -m "$RUNNER_TEMP")
          {
            echo "VCPKG_ROOT=$temp/vcpkg"
            echo "VCPKG_DEFAULT_BINARY_CACHE=$temp/vcpkg-cache/archives"
            echo "VCPKG_DOWNLOADS=$temp/vcpkg-cache/downloads"
            echo "Qt6_Path=$(cygpath -m "$QT_ROOT_DIR")"
            echo "EDITOR_TEST_PROJECT=$(cygpath -m "$PWD/build/testgame2003")"
          } >> "$GITHUB_ENV"
          mkdir -p "$temp/vcpkg-cache/archives" "$temp/vcpkg-cache/downloads"

      - name: Install vcpkg
        run: |
          git init -q "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" fetch -q --depth 1 https://github.com/microsoft/vcpkg.git "$VCPKG_COMMIT"
          git -C "$VCPKG_ROOT" checkout -q FETCH_HEAD

      # per Qt version, and saved after configuring, as on Linux
      - name: Restore the libraries of vcpkg
        id: vcpkgcache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-${{ env.TRIPLET }}-qt${{ env.QT_VERSION }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'builds/vcpkg_overlay/**') }}
          restore-keys: |
            vcpkg-${{ env.TRIPLET }}-qt${{ env.QT_VERSION }}-

      - name: Download the test game
        run: |
          builds/testgame.sh "$EDITOR_TEST_PROJECT"

      # PowerShell: the link of Git's bash would hide the linker of MSVC.
      # Configuring builds the libraries of vcpkg
      - name: Configure
        id: configure
        shell: pwsh
        run: |
          cmake --preset vcpkg-liblcf-release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DVCPKG_TARGET_TRIPLET="$env:TRIPLET" `
            -DEDITOR_TEST_PROJECT="$env:EDITOR_TEST_PROJECT"

      - name: Save the libraries of vcpkg
        if: always() && steps.configure.outcome == 'success' && steps.vcpkgcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: ${{ steps.vcpkgcache.outputs.cache-primary-key }}

      - name: Compile
        shell: pwsh
        run: |
          cmake --build --preset vcpkg-liblcf-release

      # offscreen, with Qt Quick's software renderer (as a safeguard: the
      # default Direct3D renderer was not tried offscreen on a runner)
      - name: Test
        shell: pwsh
        env:
          QT_QUICK_BACKEND: software
        run: |
          ctest --test-dir build/vcpkg-liblcf-release --output-on-failure --no-tests=error

      # The Editor with the libraries of Qt (windeployqt, by the install) and
      # of MSVC next to it, in a zip
      - name: Package
        shell: pwsh
        run: |
          $version = (Select-String -Path build/vcpkg-liblcf-release/CMakeCache.txt `
            -Pattern '^CMAKE_PROJECT_VERSION:STATIC=(.*)$').Matches[0].Groups[1].Value
          # absolute: Qt's deploy script refuses a relative install prefix
          $app = Join-Path $PWD "dist/EasyRPG Editor"
          cmake --install build/vcpkg-liblcf-release --prefix $app
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item "$env:VCToolsRedistDir/x64/Microsoft.VC*.CRT/*.dll" "$app/bin"
          Get-ChildItem -Recurse -Directory $app | Select-Object FullName
          Get-ChildItem -Recurse -File $app -Filter *.dll | Select-Object FullName
          # the Editor has no widgets (Qt Quick only)
          if (Get-ChildItem -Recurse -File $app -Filter "Qt6Widgets*.dll") {
            Write-Error "The package has Qt Widgets"
            exit 1
          }
          Compress-Archive -Path $app -DestinationPath "dist/EasyRPG-Editor-$version-Windows.zip"

      # the Editor of the zip opens the test game (tests/startup.txt) in a
      # window, with the Qt and the QML modules it carries only
      - name: Check the package
        shell: pwsh
        timeout-minutes: 5
        run: |
          $editor = Join-Path $PWD "dist/EasyRPG Editor/bin/Editor.exe"
          Remove-Item Env:QT_PLUGIN_PATH, Env:QML2_IMPORT_PATH -ErrorAction SilentlyContinue
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
          $script = Join-Path $PWD "tests/startup.txt"
          $run = Start-Process -FilePath $editor -Wait -PassThru -NoNewWindow `
            -ArgumentList "--script", "`"$script`"", "`"$env:EDITOR_TEST_PROJECT`"" `
            -RedirectStandardOutput editor-out.txt -RedirectStandardError editor-err.txt
          Get-Content editor-out.txt, editor-err.txt
          if ($run.ExitCode -ne 0) {
            Write-Error "The packaged Editor failed (exit code $($run.ExitCode))"
            exit 1
          }

      - name: Upload the zip
        uses: actions/upload-artifact@v7
        with:
          name: EasyRPG-Editor-Windows
          path: dist/*.zip

  # With "Attach to the latest release": the packages built (the Flatpak, the
  # AppImage, the disk image, the zip) attached to the latest published release
  # (checked first), replacing files of the same name, once every platform
  # asked for built
  release:
    name: "Attach to the latest release"
    if: ${{ !cancelled() && inputs.attach-to-latest-release && !contains(needs.*.result, 'failure') }}
    needs: [check-release, flatpak, appimage, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Attach them
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check-release.outputs.tag }}
        run: |
          shopt -s nullglob
          files=(artifacts/*.flatpak artifacts/*.AppImage artifacts/*.dmg artifacts/*.zip)
          [ ${#files[@]} -gt 0 ] || { echo "::error::No package was built"; exit 1; }
          ls -l "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
